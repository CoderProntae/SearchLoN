[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch-research-ai"
version = "0.1.0"
description = "A local Ollama desktop chat application with web research and usage limits"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SearchLoN contributors" }]
dependencies = [
  "PySide6>=6.6,<7",
  "cryptography>=42,<47",
  "Markdown>=3.6,<4",
  "Pygments>=2.17,<3",
  "bleach>=6.1,<7",
  "tinycss2>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyinstaller>=6.6,<7",
  "ruff>=0.11,<0.17",
]

[project.scripts]
deepsearch = "deepsearch.qt_app:main"
usage-limit-editor = "deepsearch.admin:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
